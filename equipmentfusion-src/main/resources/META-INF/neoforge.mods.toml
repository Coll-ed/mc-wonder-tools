# This is the neoforge.mods.toml for Equipment Fusion
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Equipment Fusion — Fuse two identical weapons or armor pieces in an anvil
to create a stronger piece of equipment.

Formula: new_value = left_value + floor(right_value × 0.5)

- Weapons gain attack damage
- Armor gains armor value
- Durability is fully restored
- Left-slot enchantments are preserved
'''
authors=""

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
