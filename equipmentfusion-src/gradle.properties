org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
loader_version_range=[1,)

# Mod Properties
mod_id=equipmentfusion
mod_name=Equipment Fusion
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.yourname.equipmentfusion

# =============================================================================
# Offline Build & Mirror Configuration
# =============================================================================
#
# ── Option 1: Offline Build (after manual dependency download) ──
# Uncomment the line below AFTER you have downloaded all dependencies
# using scripts/download-deps.sh (or .bat):
#
# org.gradle.offline=true
#
# ── Option 2: HTTP Proxy (if you use Clash / V2Ray / etc.) ──
# Uncomment and fill in your proxy address.  SOCKS is also supported.
#
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
#
# SOCKS proxy (alternative):
# systemProp.socksProxyHost=127.0.0.1
# systemProp.socksProxyPort=7891
#
# ── Option 3: Mirror repository (if available) ──
# If you have a local Nexus/Artifactory mirroring maven.neoforged.net,
# add it to settings.gradle:
#   pluginManagement {
#       repositories {
#           maven { url = 'https://your-mirror.example.com/repository/neoforge/' }
#       }
#   }

# Increase memory for large dependency downloads
org.gradle.jvmargs=-Xmx2G
